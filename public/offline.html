<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0d3b2a">
  <title>Sem conexão - organize!</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: 1.5rem;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      color: #eaf5ee;
      background: #0d3b2a;
    }
    main { max-width: 24rem; margin: 0 auto; }
    .marca { margin: 0 0 2rem; font-size: 2.5rem; font-weight: 800; letter-spacing: -0.045em; line-height: 1; }
    .marca span { color: #8ce6b0; }
    h1 { margin: 0 0 0.5rem; font-size: 1.5rem; letter-spacing: -0.02em; }
    p { margin: 0 0 1.5rem; line-height: 1.5; color: rgba(234, 245, 238, 0.85); }
    button {
      min-height: 3rem;
      padding: 0.7rem 1.5rem;
      font: inherit;
      font-weight: 600;
      color: #0d3b2a;
      background: #8ce6b0;
      border: 0;
      border-radius: 10px;
    }
  </style>
</head>
<body>
  <main>
    <p class="marca">organize<span>!</span></p>
    <h1>Você está sem conexão</h1>
    <p>O organize! precisa de internet para carregar suas despesas. Conecte-se e tente de novo.</p>
    <button type="button" onclick="location.reload()">Tentar de novo</button>
  </main>
</body>
</html>
